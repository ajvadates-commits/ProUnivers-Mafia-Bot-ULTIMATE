<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Top Mafia</title>
<style>
:root{
  --bg:#080b16;--bg2:#0f1225;
  --glass:rgba(99,102,241,.05);--glass2:rgba(99,102,241,.08);--glass3:rgba(99,102,241,.12);
  --border:rgba(99,102,241,.08);--border2:rgba(99,102,241,.14);
  --txt:#e2e8f0;--dim:#64748b;--muted:#475569;
  --accent:#818cf8;--accent2:#a78bfa;
  --gold:#fbbf24;--gold2:#f59e0b;
  --green:#34d399;--red:#fb7185;--blue:#60a5fa;
  --grad1:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.08));
  --grad2:linear-gradient(135deg,rgba(251,191,36,.14),rgba(245,158,11,.06));
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;padding:0;padding-bottom:72px;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ===== BACKGROUND ===== */
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.10;pointer-events:none;z-index:0}
.bg-orb.a{width:350px;height:350px;background:#6366f1;top:-100px;left:-80px;animation:orbFloat 20s ease-in-out infinite}
.bg-orb.b{width:280px;height:280px;background:#f59e0b;bottom:80px;right:-100px;animation:orbFloat 25s ease-in-out infinite reverse}
.bg-orb.c{width:220px;height:220px;background:#8b5cf6;top:45%;left:50%;transform:translateX(-50%);animation:orbFloat 18s ease-in-out infinite 2s}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;background-image:linear-gradient(rgba(99,102,241,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.3) 1px,transparent 1px);background-size:40px 40px;animation:gridScroll 60s linear infinite}

/* ===== PARTICLES ===== */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;border-radius:2px;opacity:0;animation:particleFall linear infinite}
.p:nth-child(1){width:4px;height:4px;background:#6366f1;left:10%;animation-duration:12s;animation-delay:0s}
.p:nth-child(2){width:3px;height:3px;background:#fbbf24;left:25%;animation-duration:15s;animation-delay:1s}
.p:nth-child(3){width:5px;height:5px;background:#8b5cf6;left:40%;animation-duration:10s;animation-delay:3s}
.p:nth-child(4){width:3px;height:3px;background:#34d399;left:55%;animation-duration:14s;animation-delay:2s}
.p:nth-child(5){width:4px;height:4px;background:#fb7185;left:70%;animation-duration:11s;animation-delay:4s}
.p:nth-child(6){width:6px;height:6px;background:#6366f1;left:85%;animation-duration:16s;animation-delay:.5s;border-radius:50%}
.p:nth-child(7){width:3px;height:3px;background:#f59e0b;left:15%;animation-duration:13s;animation-delay:5s}
.p:nth-child(8){width:4px;height:4px;background:#a78bfa;left:60%;animation-duration:9s;animation-delay:1.5s;border-radius:50%}
.p:nth-child(9){width:5px;height:5px;background:#60a5fa;left:35%;animation-duration:17s;animation-delay:6s}
.p:nth-child(10){width:3px;height:3px;background:#fbbf24;left:78%;animation-duration:11s;animation-delay:3.5s}
.p:nth-child(11){width:4px;height:4px;background:#818cf8;left:48%;animation-duration:14s;animation-delay:7s;border-radius:50%}
.p:nth-child(12){width:6px;height:6px;background:#34d399;left:92%;animation-duration:19s;animation-delay:2.5s}
.p:nth-child(13){width:3px;height:3px;background:#fb7185;left:5%;animation-duration:22s;animation-delay:8s;border-radius:50%}
.p:nth-child(14){width:5px;height:5px;background:#818cf8;left:52%;animation-duration:18s;animation-delay:4s}
.p:nth-child(15){width:4px;height:4px;background:#fbbf24;left:38%;animation-duration:14s;animation-delay:9s}
.p:nth-child(16){width:3px;height:3px;background:#6366f1;left:68%;animation-duration:20s;animation-delay:1.5s;border-radius:50%}

/* ===== FLOATING SHAPES ===== */
.shapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.shape{position:absolute;opacity:.04;animation:shapeFloat linear infinite}
.shape:nth-child(1){width:60px;height:60px;border:2px solid #6366f1;border-radius:12px;top:15%;left:8%;animation-duration:25s;transform:rotate(45deg)}
.shape:nth-child(2){width:40px;height:40px;border:2px solid #fbbf24;top:60%;right:10%;animation-duration:30s;border-radius:50%}
.shape:nth-child(3){width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-bottom:43px solid #8b5cf6;top:35%;left:75%;animation-duration:22s}
.shape:nth-child(4){width:50px;height:50px;border:2px solid #34d399;top:75%;left:20%;animation-duration:28s;border-radius:8px;transform:rotate(30deg)}
.shape:nth-child(5){width:35px;height:35px;border:2px solid #fb7185;top:10%;right:25%;animation-duration:20s;border-radius:50%}

/* ===== CROSSHAIR ===== */
.crosshair{position:fixed;top:50%;left:50%;width:60px;height:60px;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.03;animation:crosshairPulse 4s ease-in-out infinite}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:#818cf8}
.crosshair::before{width:1px;height:100%;left:50%;transform:translateX(-50%)}
.crosshair::after{width:100%;height:1px;top:50%;transform:translateY(-50%)}

/* ===== KEYFRAMES ===== */
@keyframes orbFloat{0%,100%{transform:translate(0,0)}25%{transform:translate(30px,-20px)}50%{transform:translate(-20px,30px)}75%{transform:translate(20px,10px)}}
@keyframes gridScroll{0%{transform:translate(0,0)}100%{transform:translate(40px,40px)}}
@keyframes particleFall{0%{transform:translateY(-20px) rotate(0deg) scale(1);opacity:0}10%{opacity:.6}50%{transform:translateY(50vh) rotate(360deg) scale(1.2)}90%{opacity:.6}100%{transform:translateY(100vh) rotate(720deg) scale(.8);opacity:0}}
@keyframes shapeFloat{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-20px) rotate(90deg)}50%{transform:translateY(10px) rotate(180deg)}75%{transform:translateY(-15px) rotate(270deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes crosshairPulse{0%,100%{opacity:.03;transform:translate(-50%,-50%) scale(1)}50%{opacity:.06;transform:translate(-50%,-50%) scale(1.2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes slideTab{from{opacity:0;transform:translateX(16px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}50%{box-shadow:0 0 24px 6px rgba(99,102,241,.2)}}
@keyframes glowGold{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 24px 6px rgba(251,191,36,.2)}}
@keyframes glowGreen{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}50%{box-shadow:0 0 16px 4px rgba(52,211,153,.15)}}
@keyframes borderGlow{0%,100%{border-color:rgba(99,102,241,.08)}50%{border-color:rgba(99,102,241,.3)}}
@keyframes borderGlowGold{0%,100%{border-color:rgba(251,191,36,.12)}50%{border-color:rgba(251,191,36,.35)}}
@keyframes countUp{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ripple{0%{transform:scale(0);opacity:.4}100%{transform:scale(4);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cardEnter{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes swing{0%,100%{transform:rotate(0deg)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
@keyframes wobble{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px) rotate(-3deg)}30%{transform:translateX(5px) rotate(2deg)}45%{transform:translateX(-4px) rotate(-1deg)}60%{transform:translateX(3px) rotate(1deg)}75%{transform:translateX(-2px)}}
@keyframes flip{0%{transform:perspective(400px) rotateY(0)}100%{transform:perspective(400px) rotateY(360deg)}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes scaleBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes neonFlicker{0%,19%,21%,23%,25%,54%,56%,100%{text-shadow:0 0 4px rgba(99,102,241,.6),0 0 11px rgba(99,102,241,.4),0 0 19px rgba(99,102,241,.2)}20%,24%,55%{text-shadow:none}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes morphBorder{0%{border-radius:16px}25%{border-radius:20px 12px}50%{border-radius:12px 20px}75%{border-radius:18px 14px}100%{border-radius:16px}}
@keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}
@keyframes textGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes zoomOut{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}
@keyframes rotateIn{from{opacity:0;transform:rotate(-180deg) scale(.5)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes flipIn{from{opacity:0;transform:perspective(400px) rotateX(90deg)}to{opacity:1;transform:perspective(400px) rotateX(0)}}
@keyframes expandWidth{from{width:0}to{width:100%}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{border-color:var(--accent)}50%{border-color:transparent}}
@keyframes pulseRing{0%{transform:scale(.8);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes successPop{0%{transform:scale(0) rotate(-45deg)}50%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-5px)}20%,40%,60%,80%{transform:translateX(5px)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.3)}70%{transform:scale(1)}}
@keyframes jelly{0%,100%{transform:scale3d(1,1,1)}30%{transform:scale3d(1.25,.75,1)}40%{transform:scale3d(.75,1.25,1)}50%{transform:scale3d(1.15,.85,1)}65%{transform:scale3d(.95,1.05,1)}75%{transform:scale3d(1.05,.95,1)}}
@keyframes rubberBand{0%,100%{transform:scale3d(1,1,1)}30%{transform:scale3d(1.25,.75,1)}40%{transform:scale3d(.75,1.25,1)}50%{transform:scale3d(1.15,.85,1)}65%{transform:scale3d(.95,1.05,1)}75%{transform:scale3d(1.05,.95,1)}}
@keyframes tada{0%,100%{transform:scale(1) rotate(0)}10%,20%{transform:scale(.9) rotate(-3deg)}30%,50%,70%,90%{transform:scale(1.1) rotate(3deg)}40%,60%,80%{transform:scale(1.1) rotate(-3deg)}}

/* ===== ANIM CLASSES ===== */
.anim{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) both}
.anim-d1{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .08s both}
.anim-d2{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .16s both}
.anim-d3{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .24s both}
.anim-d4{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .32s both}
.anim-pop{animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) both}
.anim-float{animation:float 3s ease-in-out infinite}
.anim-glow{animation:glowPulse 3s ease-in-out infinite}
.anim-glow-gold{animation:glowGold 3s ease-in-out infinite}
.anim-glow-green{animation:glowGreen 3s ease-in-out infinite}
.anim-breathe{animation:breathe 4s ease-in-out infinite}
.anim-neon{animation:neonFlicker 3s ease-in-out infinite}
.anim-jelly{animation:jelly .8s ease both}
.anim-rubber{animation:rubberBand 1s ease both}
.anim-tada{animation:tada 1s ease both}
.anim-shake{animation:shakeX .5s ease both}
.anim-bounce{animation:bounce 1s ease infinite}
.anim-swing{animation:swing 2s ease-in-out infinite}
.anim-wobble{animation:wobble 1s ease both}
.anim-flip{animation:flip .8s ease both}
.anim-rotate{animation:rotate 2s linear infinite}
.anim-scale{animation:scaleBounce 2s ease-in-out infinite}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}
.stagger-4{animation-delay:.2s}.stagger-5{animation-delay:.25s}.stagger-6{animation-delay:.3s}
.stagger-7{animation-delay:.35s}.stagger-8{animation-delay:.4s}

/* ===== HEADER ===== */
.page{position:relative;z-index:1;padding:env(safe-area-inset-top) 16px 0}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.4px;background:linear-gradient(135deg,#e2e8f0,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;animation:shimmer 4s linear infinite}
.hdr .badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hdr .live{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.18);animation:glowGreen 3s ease-in-out infinite;position:relative}
.hdr .live::after{content:"";position:absolute;inset:-3px;border-radius:20px;border:1px solid rgba(52,211,153,.2);animation:pulseRing 2s ease-out infinite}
.hdr .demo{background:rgba(99,102,241,.08);color:#64748b;border:1px solid rgba(99,102,241,.12)}

/* ===== PROFILE ===== */
.profile{display:flex;align-items:center;gap:14px;padding:0;margin-bottom:16px}
.avatar{width:52px;height:52px;border-radius:16px;overflow:hidden;background:var(--grad1);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#818cf8;flex:none;border:1px solid var(--border2);position:relative;animation:borderGlow 4s ease-in-out infinite,morphBorder 8s ease-in-out infinite}
.avatar::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.12),transparent);pointer-events:none}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.avatar:hover{animation:jelly .6s ease}
.info .n{font-size:15px;font-weight:600;letter-spacing:-.2px;transition:all .3s}
.info .n:hover{animation:textGlow 1s ease}
.info .u{font-size:12px;color:var(--dim);margin-top:1px}
.info .l{font-size:11px;color:#818cf8;margin-top:2px;font-weight:500;animation:breathe 4s ease-in-out infinite}
.xpbar{height:4px;border-radius:2px;background:rgba(99,102,241,.10);margin-top:8px;overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#a78bfa);background-size:200% 100%;transition:width 1.2s cubic-bezier(.4,0,.2,1);animation:shimmer 3s linear infinite}
.xpbar::after{content:"";position:absolute;right:0;top:-2px;width:8px;height:8px;border-radius:50%;background:#a78bfa;animation:glowPulse 2s ease-in-out infinite;opacity:0;transition:opacity .3s}
.xpbar[style*="width:"]:not([style*="width:0%"])::after{opacity:1}

/* ===== GRID ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;cursor:pointer}
.kpi::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(99,102,241,.12),transparent 70%);opacity:0;transition:opacity .3s}
.kpi:hover::before,.kpi:active::before{opacity:1}
.kpi:active{transform:scale(.92);background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.25);animation:jelly .4s ease}
.kpi .v{font-size:18px;font-weight:700;letter-spacing:-.5px;animation:countUp .7s cubic-bezier(.4,0,.2,1) both}
.kpi:nth-child(1) .v{animation-delay:.15s}
.kpi:nth-child(2) .v{animation-delay:.25s}
.kpi:nth-child(3) .v{animation-delay:.35s}
.kpi .l{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.3px}

/* ===== TABS ===== */
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:3px}
.tab{flex:1;text-align:center;padding:9px 0;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border-radius:9px;transition:all .3s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;position:relative;overflow:hidden}
.tab::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:1px;transition:all .3s cubic-bezier(.4,0,.2,1);transform:translateX(-50%)}
.tab.active::after{width:24px}
.tab.active{color:#e2e8f0;background:var(--glass3)}
.tab:active{transform:scale(.92);animation:shakeX .3s ease}

/* ===== CONTENT ===== */
.content{animation:fadeIn .3s ease}
.content .anim-tab{animation:slideTab .5s cubic-bezier(.4,0,.2,1) both}

/* ===== CARDS ===== */
.card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:2px;margin-bottom:8px;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative}
.card::before{content:"";position:absolute;inset:-1px;border-radius:14px;background:linear-gradient(135deg,rgba(99,102,241,.25),transparent 50%);opacity:0;transition:opacity .3s;z-index:-1}
.card:hover::before{opacity:1}
.card:active{transform:scale(.97);background:rgba(99,102,241,.06);border-color:rgba(99,102,241,.25)}
.card .inner{padding:14px}
.card-enter{animation:cardEnter .5s cubic-bezier(.4,0,.2,1) both}

/* ===== ROWS ===== */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);transition:all .2s;position:relative;overflow:hidden}
.row::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(99,102,241,.1),transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}
.row:hover::after{opacity:1}
.row:last-child{border:none}
.row:active{background:rgba(99,102,241,.06);animation:scaleBounce .3s ease}
.rank{width:28px;font-size:13px;font-weight:700;text-align:center;animation:slideRight .5s cubic-bezier(.4,0,.2,1) both}
.rank.g{color:var(--gold);text-shadow:0 0 16px rgba(251,191,36,.5);animation:slideRight .5s ease both,glowGold 2s ease-in-out infinite}
.rank.s{color:#c0c0c0;text-shadow:0 0 12px rgba(192,192,192,.4)}
.rank.b{color:#cd7f32;text-shadow:0 0 12px rgba(205,127,50,.4)}
.rAVA{width:34px;height:34px;border-radius:10px;background:var(--grad1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#818cf8;flex:none;border:1px solid var(--border);overflow:hidden;transition:all .3s}
.row:hover .rAVA{transform:scale(1.12) rotate(3deg);border-color:rgba(99,102,241,.3);animation:swing .5s ease}
.rAVA img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.rAVA.gold{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(245,158,11,.06));color:#fbbf24;border-color:rgba(251,191,36,.18);animation:glowGold 3s ease-in-out infinite,borderGlowGold 3s ease-in-out infinite}
.nm{flex:1;font-size:13px;font-weight:500;transition:all .2s}
.row:hover .nm{transform:translateX(4px)}
.nm small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:1px}
.pts{font-size:13px;font-weight:700;color:#818cf8;transition:all .3s}
.pts.gold{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.4);animation:scaleBounce 2s ease-in-out infinite}
.row:hover .pts{transform:scale(1.1);color:#a78bfa}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:40px 16px;color:#475569;font-size:13px;line-height:1.6}
.empty .ico{font-size:32px;margin-bottom:8px;opacity:.4;animation:float 3s ease-in-out infinite}
.empty .ico-glow{filter:drop-shadow(0 0 10px rgba(99,102,241,.4))}

/* ===== STAT ROWS ===== */
.stat-row{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font:inherit;font-size:13px;transition:all .2s;position:relative;overflow:hidden}
.stat-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--accent),var(--accent2));transform:scaleY(0);transition:transform .25s cubic-bezier(.4,0,.2,1);border-radius:1px;transform-origin:bottom}
.stat-row:hover::before{transform:scaleY(1)}
.stat-row:last-child{border:none}
.stat-row:active{background:rgba(99,102,241,.06)}
.stat-row .k{color:var(--dim);transition:all .2s}
.stat-row:hover .k{color:#94a3b8;transform:translateX(4px)}
.stat-row .v{font-weight:600;transition:all .3s}
.stat-row:hover .v{color:#e2e8f0;transform:scale(1.05)}

/* ===== BOTTOM NAV ===== */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,11,22,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:10}
.nav a{flex:1;text-align:center;text-decoration:none;color:#475569;font-size:10px;font-weight:500;padding:6px 0;transition:all .25s cubic-bezier(.4,0,.2,1);letter-spacing:.3px;position:relative}
.nav a.active{color:#818cf8}
.nav a .ic{font-size:18px;display:block;margin-bottom:2px;opacity:.5;transition:all .3s}
.nav a.active .ic{opacity:1;transform:translateY(-3px) scale(1.15);animation:bounce 1.5s ease-in-out infinite}
.nav a:active .ic{animation:shakeX .3s ease}

/* ===== SHIMMER ===== */
.shimmer{background:linear-gradient(90deg,transparent 0%,rgba(99,102,241,.04) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 1.8s infinite;border-radius:14px}

/* ===== SPARKLE ===== */
.sparkle{position:absolute;width:6px;height:6px;background:var(--gold);border-radius:50%;pointer-events:none;animation:sparkle 1.5s ease-in-out infinite}

/* ===== GLITCH ===== */
.glitch{position:relative}
.glitch:hover{animation:glitch .3s ease}

/* ===== TOOLTIP ===== */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(.8);background:rgba(8,11,22,.95);border:1px solid var(--border2);border-radius:8px;padding:4px 10px;font-size:11px;color:var(--txt);white-space:nowrap;opacity:0;pointer-events:none;transition:all .2s;z-index:20;animation:slideDown .2s ease both}
[data-tip]:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
</style>
</head>
