<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Top Mafia</title>
<style>
:root{
  --bg:#06060f;--bg2:#0d0d1a;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);--glass3:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.10);
  --txt:#e8eaed;--dim:#6b7280;--muted:#4b5563;
  --accent:#818cf8;--accent2:#a78bfa;
  --gold:#fbbf24;--gold2:#f59e0b;
  --green:#34d399;--red:#f87171;--blue:#60a5fa;
  --grad1:linear-gradient(135deg,rgba(129,140,248,.15),rgba(167,139,250,.08));
  --grad2:linear-gradient(135deg,rgba(251,191,36,.12),rgba(245,158,11,.06));
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;padding:0;padding-bottom:72px;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.12;pointer-events:none;z-index:0}
.bg-orb.a{width:300px;height:300px;background:var(--accent);top:-80px;left:-60px}
.bg-orb.b{width:250px;height:250px;background:var(--gold);bottom:60px;right:-80px}
.bg-orb.c{width:200px;height:200px;background:var(--accent2);top:40%;left:50%;transform:translateX(-50%)}
.page{position:relative;z-index:1;padding:env(safe-area-inset-top) 16px 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes slideTab{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.anim{animation:fadeUp .4s ease both}
.anim-d1{animation:fadeUp .4s ease .05s both}
.anim-d2{animation:fadeUp .4s ease .1s both}
.anim-d3{animation:fadeUp .4s ease .15s both}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.4px}
.hdr .badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hdr .live{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.15)}
.hdr .demo{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--border)}
.profile{display:flex;align-items:center;gap:14px;padding:0;margin-bottom:16px}
.avatar{width:52px;height:52px;border-radius:16px;overflow:hidden;background:var(--grad1);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);flex:none;border:1px solid var(--border2);position:relative}
.avatar::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);pointer-events:none}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.info .n{font-size:15px;font-weight:600;letter-spacing:-.2px}
.info .u{font-size:12px;color:var(--dim);margin-top:1px}
.info .l{font-size:11px;color:var(--accent);margin-top:2px;font-weight:500}
.xpbar{height:4px;border-radius:2px;background:var(--glass2);margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s cubic-bezier(.4,0,.2,1)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;transition:transform .2s,background .2s}
.kpi:active{transform:scale(.97);background:var(--glass2)}
.kpi .v{font-size:18px;font-weight:700;letter-spacing:-.5px}
.kpi .l{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.3px}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:3px}
.tab{flex:1;text-align:center;padding:9px 0;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border-radius:9px;transition:all .25s cubic-bezier(.4,0,.2,1);letter-spacing:.2px}
.tab.active{color:var(--txt);background:var(--glass3)}
.tab:active{transform:scale(.96)}
.content{animation:fadeIn .3s ease}
.content .anim-tab{animation:slideTab .35s ease both}
.card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:2px;margin-bottom:8px;overflow:hidden;transition:transform .2s}
.card:active{transform:scale(.98)}
.card .inner{padding:14px}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background .15s}
.row:last-child{border:none}
.row:active{background:var(--glass2)}
.rank{width:28px;font-size:13px;font-weight:700;text-align:center}
.rank.g{color:var(--gold)}
.rank.s{color:#c0c0c0}
.rank.b{color:#cd7f32}
.rAVA{width:34px;height:34px;border-radius:10px;background:var(--grad1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent);flex:none;border:1px solid var(--border);overflow:hidden}
.rAVA img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.rAVA.gold{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.05));color:var(--gold);border-color:rgba(251,191,36,.15)}
.nm{flex:1;font-size:13px;font-weight:500}
.nm small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:1px}
.pts{font-size:13px;font-weight:700;color:var(--accent)}
.pts.gold{color:var(--gold)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.empty .ico{font-size:32px;margin-bottom:8px;opacity:.3}
.stat-row{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;transition:background .15s}
.stat-row:last-child{border:none}
.stat-row:active{background:var(--glass2)}
.stat-row .k{color:var(--dim)}
.stat-row .v{font-weight:600}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(6,6,15,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:10}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:10px;font-weight:500;padding:6px 0;transition:color .2s;letter-spacing:.3px}
.nav a.active{color:var(--accent)}
.nav a .ic{font-size:18px;display:block;margin-bottom:2px;opacity:.7}
.nav a.active .ic{opacity:1}
.shimmer{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.03) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 2s infinite}
</style>
</head>
<body>
<div class="bg-orb a"></div>
<div class="bg-orb b"></div>
<div class="bg-orb c"></div>
<div class="page">
<div class="hdr anim"><h1>Top Mafia</h1><span class="badge demo" id="mode">DEMO</span></div>
<div class="profile anim-d1">
  <div class="avatar" id="av">M</div>
  <div class="info" style="flex:1">
    <div class="n" id="nm">Mafia o'yinchi</div>
    <div class="u" id="un">@username</div>
    <div class="l" id="lv">Daraja 1</div>
    <div class="xpbar"><i id="xp" style="width:0%"></i></div>
  </div>
</div>
<div class="grid anim-d2">
  <div class="kpi"><div class="v" id="k1" style="color:var(--gold)">0</div><div class="l">COIN</div></div>
  <div class="kpi"><div class="v" id="k2">0</div><div class="l">O'YIN</div></div>
  <div class="kpi"><div class="v" id="k3" style="color:var(--green)">0</div><div class="l">G'ALABA</div></div>
</div>
<div class="tabs anim-d3">
  <div class="tab active" data-t="profile">Profil</div>
  <div class="tab" data-t="groups">Guruhlar</div>
  <div class="tab" data-t="top">Reyting</div>
  <div class="tab" data-t="activity">Harakatlar</div>
</div>
<div class="content" id="ct"></div>
</div>
<div class="nav">
  <a href="#" class="active"><span class="ic">&#9679;</span>Profil</a>
  <a href="https://t.me/topmafia_uzbot"><span class="ic">&#9654;</span>O'ynash</a>
  <a href="https://t.me/topmafia_uzbot" onclick="Telegram&&Telegram.WebApp.close()"><span class="ic">&#10005;</span>Yopish</a>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
